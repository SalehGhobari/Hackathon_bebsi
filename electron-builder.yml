appId: jo.fahes.desktop
productName: Fahes
copyright: MIT
directories:
  output: release
files:
  - dist/electron/**/*
  - ui/**/*
  - package.json
asar: true
linux:
  target:
    - AppImage
  icon: build/icon.png
  category: Utility
  artifactName: ${productName}-${version}-${arch}.AppImage
win:
  target:
    - nsis
  icon: build/icon.ico
  artifactName: ${productName}-Setup-${version}-${arch}.exe
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
